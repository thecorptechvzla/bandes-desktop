name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store dir
        id: pnpm-cache
        shell: pwsh
        run: echo "store=$(pnpm store path)" >> $env:GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Build sidecar (backend-api.exe con DB del SRV)
        working-directory: backend
        run: pnpm desktop:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installer + updater artifacts
        working-directory: frontend
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate latest.json for updater
        working-directory: frontend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\artifacts
          $setup = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe |
            Where-Object { $_.Name -match 'setup' } | Select-Object -First 1
          if (-not $setup) { throw 'No se encontró el instalador NSIS (setup.exe)' }
          $sig = (& pnpm tauri signer sign "$($setup.FullName)" 2>&1 | Out-String)
          $sigLine = ($sig -split "`r?`n" | Where-Object { $_ -match '^[A-Za-z0-9+/=]+$' } | Select-Object -First 1).Trim()
          if (-not $sigLine) { throw 'No se pudo obtener la firma del instalador' }
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $json = [ordered]@{
            version = $version
            notes = ''
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = $sigLine
                url = "http://192.168.1.108:8090/$($setup.Name)"
              }
            }
          }
          $json | ConvertTo-Json -Depth 4 | Set-Content -Path C:\artifacts\latest.json -Encoding utf8
          Write-Output "latest.json generado para v$version"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path c:\artifacts
          Copy-Item frontend/src-tauri/target/release/bundle/nsis/*.exe c:\artifacts\ -ErrorAction SilentlyContinue
          Copy-Item frontend/src-tauri/target/release/bundle/msi/* c:\artifacts\ -ErrorAction SilentlyContinue
          Get-ChildItem c:\artifacts | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bandes-installers
          path: c:\artifacts\
          if-no-files-found: error